<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="540" height="120" fill="none">
  <defs>
    <!-- Sun Energy Radiant Gradient -->
    <linearGradient id="sunGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Solar Cell Silicon Blue Gradient -->
    <linearGradient id="panelGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>

    <!-- Clean Tech Emerald Gradient -->
    <linearGradient id="ecoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="solarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- LOGO EMBLEM (Left: X=15 to 115, Y=10 to 110) -->
  <g transform="translate(15, 10)">
    <!-- Radiant Outer Sun Rays & Aura -->
    <circle cx="50" cy="50" r="44" stroke="url(#sunGradient)" stroke-width="2.5" stroke-dasharray="5 7" opacity="0.65" />
    <circle cx="50" cy="50" r="38" stroke="#38BDF8" stroke-width="1.2" opacity="0.4" />
    
    <!-- Sun Disc (Top Right Radiant Arc) -->
    <path d="M 32 28 A 28 28 0 0 1 78 54 A 32 32 0 0 0 32 28 Z" fill="url(#sunGradient)" filter="url(#solarGlow)" />
    <circle cx="64" cy="36" r="14" fill="url(#sunGradient)" />

    <!-- 3D Perspective Photovoltaic Solar Grid Panel -->
    <polygon points="16,74 56,58 88,66 42,90" fill="url(#panelGradient)" stroke="#38BDF8" stroke-width="1.5" />
    
    <!-- Solar Cell Grid Lines (Perspective Matrix) -->
    <line x1="36" y1="65" x2="65" y2="78" stroke="#BAE6FD" stroke-width="1.2" opacity="0.8" />
    <line x1="26" y1="81" x2="72" y2="63" stroke="#BAE6FD" stroke-width="1.2" opacity="0.8" />
    <line x1="30" y1="69" x2="48" y2="88" stroke="#7DD3FC" stroke-width="1" opacity="0.65" />
    <line x1="43" y1="64" x2="61" y2="83" stroke="#7DD3FC" stroke-width="1" opacity="0.65" />
    <line x1="68" y1="61" x2="78" y2="72" stroke="#7DD3FC" stroke-width="1" opacity="0.65" />

    <!-- Clean Tech Leaf / Energy Lightning Arc -->
    <path d="M 42 90 Q 28 76 36 58 Q 40 70 56 68 Z" fill="url(#ecoGradient)" />
    <!-- Dynamic Lightning Flash Energy Bolt -->
    <polygon points="53,40 45,54 52,54 44,70 61,51 53,51" fill="#FEF08A" />
  </g>

  <!-- TYPOGRAPHY HIERARCHY (X=130 onwards) -->
  <g transform="translate(132, 32)">
    <!-- Primary Brand Title -->
    <text x="0" y="36" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">
      ALMIGHTY SOLAR
    </text>

    <!-- Brand Category / Subtitle -->
    <text x="0" y="62" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#F59E0B" letter-spacing="3.2">
      ENERGY • INDORE (M.P.)
    </text>
  </g>
</svg>
